static=yes
writeprotect=no

[globals]
API_CALLLOG_URL=https://interface.pulsarpportal.live/api/call-logs/create/
API_ROUTE_URL=https://interface.pulsarpportal.live/api/request-route/
API_TOKEN=REPLACE_WITH_NEW_ACTIVE_PORTAL_API_TOKEN

REC_BASE_DIR=/srv/ingress_records

DEFAULT_TARGET_SIP_USER=911
DEFAULT_TARGET_SIP_PORT=5060

[from-trunk]
exten => 911,1,NoOp(Ingress start)
 same => n,Set(__ROUTE_KEY=${SIP_HEADER(X-VICIdial-Route-Key)})
 same => n,Set(__DIALER_NAME=${SIP_HEADER(X-VICIdial-Dialer-Name)})
 same => n,Set(__HDR_UNIQUE_ID=${SIP_HEADER(X-VICIdial-Unique-Id)})
 same => n,Set(__HDR_CAMPAIGN_ID=${SIP_HEADER(X-VICIdial-Campaign-Id)})
 same => n,Set(__HDR_LEAD_ID=${SIP_HEADER(X-VICIdial-Lead-Id)})
 same => n,Set(__HDR_CALLER_ID=${SIP_HEADER(X-VICIdial-Caller-Id)})
 same => n,Set(__HDR_VALUE=${SIP_HEADER(X-VICIdial-value)})
 same => n,Set(__HDR_CLIENT_ID=${SIP_HEADER(X-VICIdial-Client-Id)})

 same => n,Set(__INGRESS_UID=${UNIQUEID})
same => n,Set(__CALL_ID=${HDR_CALLER_ID})
 same => n,NoOp(Dialer=${DIALER_NAME} Route-Key=${ROUTE_KEY} Call-ID=${CALL_ID})
 same => n,System(/bin/mkdir -p ${REC_BASE_DIR})

 ; 1) create call-log, 2) fetch route, 3) set CALL_UUID and TARGET_SERVER_IP
 same => n,AGI(/opt/ingress/api_route.py,${CALL_ID},${DIALER_NAME},${API_CALLLOG_URL},${API_ROUTE_URL},${API_TOKEN},${DEFAULT_TARGET_SIP_USER},${DEFAULT_TARGET_SIP_PORT})
 same => n,GotoIf($["${LOOKUP_OK}"="1"]?prepare_recording:api_fail)

 same => n(prepare_recording),NoOp(API OK UUID=${CALL_UUID} Target=${TARGET_SERVER_IP})

 ; recording path = /srv/ingress_records/<call_uuid>.wav
 same => n,Set(__SAFE_CALL_UUID=${CALL_UUID})
 same => n,Set(__INGRESS_REC_FILE=${REC_BASE_DIR}/${SAFE_CALL_UUID}.wav)
 same => n,MixMonitor(${INGRESS_REC_FILE})

 ; preserve inbound metadata
 same => n,SIPAddHeader(X-VICIdial-Unique-Id: ${HDR_UNIQUE_ID})
 same => n,SIPAddHeader(X-VICIdial-Campaign-Id: ${HDR_CAMPAIGN_ID})
 same => n,SIPAddHeader(X-VICIdial-Lead-Id: ${HDR_LEAD_ID})
 same => n,SIPAddHeader(X-VICIdial-Caller-Id: ${HDR_CALLER_ID})
 same => n,SIPAddHeader(X-VICIdial-value: ${HDR_VALUE})
 same => n,SIPAddHeader(X-VICIdial-Client-Id: ${HDR_CLIENT_ID})
 same => n,SIPAddHeader(X-VICIdial-Route-Key: ${ROUTE_KEY})
 same => n,SIPAddHeader(X-VICIdial-Dialer-Name: ${DIALER_NAME})

 ; add uuid returned by your API
same => n,SIPAddHeader(X-VICIdial-Call-UUID: ${CALL_UUID})
same => n,SIPAddHeader(X-VICIdial-Flow: ${CALL_FLOW})
same => n,SIPAddHeader(X-VICIdial-Batch: ${CALL_BATCH})
same => n,SIPAddHeader(X-VICIdial-Project: ${ROUTE_PROJECT})
same => n,SIPAddHeader(X-VICIdial-XferExten: ${ROUTE_XFEREXTEN})

 ; route dynamically to the API-returned IP
 same => n,Dial(SIP/${TARGET_SIP_USER}@${TARGET_SERVER_IP}:${TARGET_SIP_PORT},90,tTo)
 same => n,Hangup()

 same => n(api_fail),NoOp(API failed status=${API_STATUS} reason=${API_REASON} dialer=${DIALER_NAME} call_id=${CALL_ID})
 same => n,Hangup(1)

exten => h,1,NoOp(Hangup rec=${INGRESS_REC_FILE} uuid=${CALL_UUID} cause=${HANGUPCAUSE})
 same => n,StopMixMonitor()
 same => n,NoOp(Ingress hangup complete)

exten => 811,1,NoOp(Test call landed directly on 811)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

exten => _X.,1,NoOp(Unexpected extension ${EXTEN})
 same => n,Hangup()
